name: 'setup-gel'
description: 'Set up Gel CLI and Server and make them available in PATH'
author: 'Gel Data Inc.'
inputs:
  cli-version:
    required: false
    description: >
      Version range or exact version of Gel CLI to set up, using SemVer's
      version range syntax, or one of the predefined rolling version specifiers:
      "nightly" for the latest nightly build, "stable" for the latest stable
      release. Defaults to "stable".
    default: 'stable'
  server-version:
    required: false
    description: >
      Version of Gel server to install, or "stable" for the latest stable
      release, or "nightly" for the latest nightly build, or "none" to skip
      installation. Defaults to "stable".
    default: 'stable'
  instance-name:
    required: false
    description: >
      Name of Gel instance to be used when creating new instance, linking or
      initializing the project. If not set, the name will be auto-generated.
    default: ''
  server-dsn:
    required: false
    description: >
      If set, specifies the DSN of a remote Gel instance to link to instead of
      initializing a new local instance.  By default, a new instance will be
      initialized.
    default: 'false'
  server-password:
    required: false
    description: >
      If set, the password is passed to the `gel instance link` command via
      stdin using `--password-from-stdin` instead of being embedded in the DSN.
      Use this to avoid DSN parse errors when the password contains characters
      that require URL percent-encoding (e.g. `:`, `/`, `@`, `?`, `#`, `%`,
      `&`).
    default: ''
  project-dir:
    required: false
    description: >
      If set, specifies the directory with gel.toml project manifest.
    default: ''
runs:
  using: 'node20'
  main: 'dist/index.js'
